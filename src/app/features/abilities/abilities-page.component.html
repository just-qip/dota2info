<section class="page">
  <header class="page-header">
    <h1>
      Abilities
      <span class="count" *ngIf="!loading()">({{ abilities().length }})</span>
    </h1>

    <nav class="alphabet-nav" *ngIf="!loading()">
      <button
        type="button"
        *ngFor="let group of groups(); trackBy: trackByLetter"
        class="letter-link"
        [class.active]="activeLetter() === group.letter"
        (click)="scrollToLetter(group.letter)"
      >
        {{ group.letter }}
      </button>
    </nav>
  </header>

  <div *ngIf="loading()" class="loading">Loading abilities…</div>

  <div class="groups" *ngIf="!loading()">
    <section
      class="group"
      *ngFor="let group of groups(); trackBy: trackByLetter"
    >
      <h2 class="group-letter" [id]="'ability-letter-' + group.letter">
        {{ group.letter }}
        <span class="group-count">{{ group.items.length }}</span>
      </h2>

      <div class="abilities-grid">
        <app-ability-icon
          *ngFor="let entry of group.items; trackBy: trackById"
          [abilityId]="entry.id"
          [displayName]="entry.ability.dname || entry.id"
          [imgPath]="entry.ability.img || ''"
        />
      </div>
    </section>
  </div>
</section>
