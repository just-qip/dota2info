<section class="page">
  <header class="page-header">
    <h1>
      Heroes
      <span class="count" *ngIf="!loading()">({{ heroes().length }})</span>
    </h1>

    <nav class="alphabet-nav" *ngIf="!loading()">
      <a
        *ngFor="let group of groups(); trackBy: trackByLetter"
        [href]="'#hero-letter-' + group.letter"
        class="letter-link"
      >
        {{ group.letter }}
      </a>
    </nav>
  </header>

  <div *ngIf="loading()" class="loading">Loading heroes…</div>

  <div class="groups" *ngIf="!loading()">
    <section
      class="group"
      *ngFor="let group of groups(); trackBy: trackByLetter"
    >
      <h2 class="group-letter" [id]="'hero-letter-' + group.letter">
        {{ group.letter }}
        <span class="group-count">{{ group.items.length }}</span>
      </h2>

      <div class="heroes-grid">
        <app-hero-icon
          *ngFor="let entry of group.items; trackBy: trackById"
          [heroId]="entry.id"
          [displayName]="entry.hero.localized_name"
          [imgPath]="entry.hero.img"
        />
      </div>
    </section>
  </div>
</section>
