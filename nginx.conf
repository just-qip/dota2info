server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Виджет: /widget/elements.js ─────────────────────────────
    # Префикс ^~ — обязательно, иначе сработает regex-локация .js$ ниже
    # и CORS-заголовков не будет (браузер заблокирует <script type="module">).
    location ^~ /widget/ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        # Preflight (на всякий случай — для module-скриптов обычно не приходит).
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Короткий кэш — чтобы обновления виджета подхватывались.
        add_header Cache-Control 'public, max-age=300' always;
        try_files $uri =404;
    }

    # ── Данные: /assets/data/*.json ─────────────────────────────
    location /assets/data/ {
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept' always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri $uri/ =404;
    }

    # ── Сырой билд виджета (dist/dota2info-elements → /elements/) ──
    location ^~ /elements/ {
        add_header Access-Control-Allow-Origin '*' always;
        try_files $uri $uri/ =404;
    }

    # ── SPA ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Статика SPA: длинный кэш ───────────────────────────────
    # ВАЖНО: эта regex-локация не должна пересекаться с /widget/ и /elements/,
    # поэтому выше они зафиксированы через ^~.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable' always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
